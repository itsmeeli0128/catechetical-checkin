<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        5th Diocesan Catechists' Congress 2026
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://unpkg.com/html5-qrcode"
        defer
    ></script>

    <!-- v=2 forces GitHub Pages to load the updated app.js -->
    <script
        src="app.js?v=2"
        defer
    ></script>
</head>

<body>

    <div class="container">

        <div class="header">

            <img
                src="Diocese-of-Catarman-235x300__1_-removebg-preview.png"
                alt="Diocese of Catarman Logo"
            >

            <img
                src="543358746_1271965641328994_8060104371518457444_n-removebg-preview.png"
                alt="Commission on Evangelization and Catechesis Logo"
            >

        </div>

        <h1>
            5th Diocesan Catechists' Congress 2026
        </h1>

        <h2>
            Diocese of Catarman
        </h2>

        <div class="subtitle">
            Commission on Evangelization and Catechesis
            <br>
            Official QR Check-in System
        </div>

        <button
            id="enableSoundButton"
            type="button"
            onclick="enableSound()"
            style="
                margin-bottom:18px;
                padding:11px 20px;
                font-size:15px;
                font-weight:bold;
                background:#153e75;
                color:white;
                border:none;
                border-radius:9px;
                cursor:pointer;
            "
        >
            🔈 Enable Scanner Sound
        </button>

        <div id="reader"></div>

        <div id="status">
            📷 Ready to Scan...
        </div>

        <div class="footer">
            © 2026 Diocese of Catarman
            <br>
            Commission on Evangelization and Catechesis
        </div>

    </div>

</body>

</html>
